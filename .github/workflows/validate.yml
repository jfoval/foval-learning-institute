name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      # The lints' own tests: fixture lessons that must fail each check.
      - run: npm test
      # Checks the curriculum map against the Core path, then lints every lesson.
      - run: npm run validate
      # site/data/courses.js is generated and committed. If a build here changes it,
      # someone edited content without rebuilding, and the live site is behind.
      - run: npm run build
      - name: Check the committed build output is current
        # index.html and sw.js carry content hashes of the assets they load. If they are
        # stale the deploy is invisible to anyone who has visited before, which is exactly
        # the bug this stamping was added to fix, so a stale stamp fails the build.
        run: |
          if ! git diff --quiet -- site/data/courses.js site/index.html site/sw.js; then
            echo "Generated output is out of date. Run 'npm run build' and commit the result."
            git diff --stat -- site/data/courses.js site/index.html site/sw.js
            exit 1
          fi
