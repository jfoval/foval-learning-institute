name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      # The lints' own tests: fixture lessons that must fail each check.
      - run: npm test
      # Checks the curriculum map against the Core path, then lints every lesson.
      - run: npm run validate
      # The build is generated into dist/ and published from there by the Pages workflow, so
      # there is nothing committed to compare against. Running it here still proves it runs.
      - run: npm run build
