# Podcast episodes still owed, per published course.
#
# Root CLAUDE.md rule 6: a course is finished when every lesson is at standard AND every lesson has a
# podcast episode. `npm run validate` enforces it. A published course whose lessons are not all
# stamped with an `audio:` URL fails the build unless it is listed here with the number of
# episodes it owes.
#
# This file is a RATCHET, not a permission slip. The number is a ceiling:
#   - owe MORE than the number here  -> the build fails. Render the episode.
#   - owe FEWER                      -> the build fails. Lower the number in the same commit.
#   - owe none                       -> delete the entry.
# So an existing number can only shrink, and the debt is visible in one place instead of being
# argued about in a handoff paragraph. When this file is empty, every live course is finished.
#
# A COURSE OPENS ITS OWN LINE WHEN IT PUBLISHES, at its full lesson count, in the same commit that
# sets `status: published`. That is DECISIONS.md section 2, decided 2026-09-17: audio gates the
# word "finished", not publishing, because drafting spends tokens and rendering spends money and
# the two budgets refill on different clocks. The build accepts a new entry ONLY at the course's
# exact lesson count, so a course cannot slip in here already missing some episodes with nobody
# counting them. Once the line exists it only shrinks. Pinned by tests in scripts/tests/build.test.mjs.
#
# The file exists because the rule arrived after 47 episodes were already owed. Failing the build
# on all of them would have meant nobody could commit anything, so the debt was written down.
#
# Opened 2026-09-09 with the debt as it stood that day: 47 episodes across six courses.
#
# A RESET is the one way a number here may go up. It exists because on 2026-09-18 every episode the
# institute had shipped was withdrawn: they were rendered in one long call on an engine that fades,
# so each one starts right and ends with a host whispering or recast. John listened, approved the
# replacement, and asked for the old ones deleted and rebuilt one at a time. That is a deliberate
# quality decision, not debt drifting upward, so it is written down rather than worked around.
# `npm run validate` accepts a reset only in the commit that introduces it (it compares `date`
# against the committed file), and only for the exact numbers in `raises`. The commit after it, the
# ratchet is back on. Do not write one to get past the check on work you are doing now.
# The behaviour is pinned by tests in `scripts/tests/build.test.mjs`, because this check was broken
# twice on the day it was written and both times everything still printed "ok".

reset:
  date: 2026-09-18
  reason: >-
    Every episode rendered before 2026-09-18 fades: the level falls about 20 dB across the episode
    and the male host drops out with it. Cause and fix are in docs/DECISIONS.md section 7. The
    thirteen defective episodes were deleted from R2 and unstamped; How to Learn Anything lesson 1
    was re-rendered on the new pipeline and is live. The rest come back one at a time.
  raises:
    how-to-learn-anything: 7
    bible-basics: 12
    logic-and-argument: 10
    personal-finance: 10

owed:
  # course id (the folder name)   : episodes still to render
  bible-basics: 9
