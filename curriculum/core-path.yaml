      - { id: "algebra-essentials", school: "mathematics", title: "Algebra Essentials" }
      - { id: "geometry-and-trigonometry", school: "mathematics", title: "Geometry and Trigonometry" }
      - { id: "statistics-for-citizens", school: "foundations", title: "Statistics for Citizens" }
      - { id: "probability-and-decisions", school: "foundations", title: "Probability and Decisions" }
      - { id: "scientific-method", school: "foundations", title: "The Scientific Method" }
      - { id: "research-skills", school: "foundations", title: "Research Skills" }

  - title: "Computing"
