# The Foval Core: every course on the map, in the order it should be taken.
# Source of truth for the site's Path page and for the Path column in TAXONOMY.md.
#
# There is no elective tier. John's call, 2026-09-08: a course that is worth putting on the map
# is worth telling a learner when to take it, so all 174 courses sit somewhere in this file and
# `npm run validate` fails if one does not.
#
# Design: terms of seven, ordered so that nothing arrives before what it needs. Tools and the
# skills of running yourself come first because every later term uses them; quantitative
# foundations before the sciences; history in chronological order; the courses that are really
# second courses (Calculus, Data Structures, the Christian tradition in depth) sit after the
# course they continue. Every term mixes at least two schools, so a learner following the path
# is always working across head, world, and hands.

terms:
  - title: "Tools"
    theme: "How to learn, read, write, and think. Every other term assumes these seven."
    courses:
      - { id: "how-to-learn-anything", school: "learning-and-mind", title: "How to Learn Anything" }
      - { id: "reading-well", school: "foundations", title: "Reading Well" }
      - { id: "clear-writing", school: "communication-and-people", title: "Writing Clearly" }
      - { id: "logic-and-argument", school: "foundations", title: "Logic and Argument" }
      - { id: "digital-literacy", school: "computer-science-and-ai", title: "Digital Literacy" }
      - { id: "using-ai-effectively", school: "computer-science-and-ai", title: "Using AI Effectively" }
      - { id: "time-management", school: "learning-and-mind", title: "Time Management" }

  - title: "Running yourself"
    theme: "Attention, memory, money and rest. The machinery you study with, before you study anything hard."
    courses:
      - { id: "personal-finance", school: "money", title: "Personal Finance Fundamentals" }
      - { id: "habits-and-self-discipline", school: "learning-and-mind", title: "Habits and Self-Discipline" }
      - { id: "focus-and-deep-work", school: "learning-and-mind", title: "Focus and Deep Work" }
      - { id: "memory", school: "learning-and-mind", title: "Memory" }
      - { id: "note-taking", school: "learning-and-mind", title: "Note-Taking and Personal Knowledge" }
      - { id: "sleep", school: "health-and-body", title: "Sleep" }
      - { id: "mental-fitness", school: "health-and-body", title: "Mental Fitness" }

  - title: "The body and the household"
    theme: "Feeding, moving, repairing and protecting yourself. Nothing here needs a prerequisite and everything here is used weekly."
    courses:
      - { id: "nutrition", school: "health-and-body", title: "Nutrition: The Evidence" }
      - { id: "strength-and-fitness", school: "health-and-body", title: "Strength and Fitness" }
      - { id: "cooking-fundamentals", school: "practical-life-and-self-reliance", title: "Cooking Fundamentals" }
      - { id: "first-aid", school: "health-and-body", title: "First Aid and CPR" }
      - { id: "personal-safety", school: "practical-life-and-self-reliance", title: "Personal Safety" }
      - { id: "home-repair", school: "practical-life-and-self-reliance", title: "Home Repair and Maintenance" }
      - { id: "car-basics", school: "practical-life-and-self-reliance", title: "Car Basics" }

  - title: "People"
    theme: "Listening, speaking, disagreeing, and living with others. The skills that decide how far everything else travels."
    courses:
      - { id: "conversation-and-listening", school: "communication-and-people", title: "Conversation and Listening" }
      - { id: "public-speaking", school: "communication-and-people", title: "Public Speaking" }
      - { id: "understanding-people", school: "communication-and-people", title: "Understanding People: Psychology Fundamentals" }
      - { id: "social-skills", school: "communication-and-people", title: "Social Skills and Etiquette" }
      - { id: "conflict-resolution", school: "communication-and-people", title: "Conflict Resolution" }
      - { id: "relationships-and-family", school: "communication-and-people", title: "Relationships and Family" }
      - { id: "cognitive-biases", school: "foundations", title: "Cognitive Biases and Clear Thinking" }

  - title: "Quantitative foundations"
    theme: "Numbers, chance, evidence, and the scientific way of knowing. Everything quantitative later starts here."
    courses:
