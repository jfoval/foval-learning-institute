id: cooking-fundamentals
title: Cooking Fundamentals
school: practical-life-and-self-reliance
subject: Practical Life & Self-Reliance
level: Foundation
status: drafting
summary: >-
  Cook without a recipe in front of you: how heat, salt, fat and acid behave, the handful of
  techniques most dishes are built from, and how to keep a kitchen safe.
description: >-
  Recipes tell you what to do; this course is about why it works, so that you can cook the tenth
  dish without instructions and rescue the one that is going wrong. It covers knife work, how heat
  moves into food, the main dry and wet cooking methods, seasoning by taste, eggs, grains, stocks and
  sauces, bread, and the food-safety rules that actually matter, with the science kept to what
  changes what you do at the stove. It sits in the term on the body and the household because
  cooking for yourself is the most practical thing most people can learn in a month.
outcomes:
  - Hold and use a chef's knife safely and cut the basic shapes evenly
  - >-
    Explain how conduction, convection and radiation cook food, and choose a method and a heat
    level for a given ingredient
  - Sear, roast, sauté, braise, poach and boil, and say what each does to texture and flavour
  - Season by tasting, adjusting salt, acid, fat and heat until a dish is balanced
  - >-
    Cook eggs, rice and other grains, a stock, a pan sauce and a simple bread without a recipe
  - >-
    Store, thaw, cook and cool food within the temperatures and times that public food-safety
    guidance sets, and say which common kitchen beliefs are wrong
  - Plan and cook a week of meals from a short list of techniques rather than a list of recipes
prerequisites: []
sensitive_domain: false
