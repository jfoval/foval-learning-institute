id: personal-safety
title: Personal Safety
school: practical-life-and-self-reliance
subject: Practical Life & Self-Reliance
level: Foundation
status: drafting
summary: >-
  Notice trouble early, stay out of most of it, talk your way down from the rest, and know what the
  evidence and the law actually say about protecting yourself.
description: >-
  Most harm people fear is rarer, and most harm they risk is more ordinary, than the headlines
  suggest. This course starts from what the crime and injury data say about who is actually at risk
  and where, then teaches awareness, avoidance, de-escalation and the basics of getting away, with
  the law on self-defence in the US and the UK set out side by side as general information. It sits
  after First Aid and CPR because what to do once someone is hurt is already taught there. It is a
  page to prepare for a hands-on class, not a substitute for one.
outcomes:
  - >-
    Read a crime or safety statistic for what it measures, and compare the risks you fear with the
    risks you actually run
  - Describe what situational awareness is and what the evidence says it can and cannot do
  - Plan routes, routines and home and online habits that lower the chance of being targeted
  - >-
    Use de-escalation to calm a tense encounter, and recognise when to stop talking and leave
  - >-
    Explain what US and UK law say about using force in self-defence, as general information, and
    why escape comes first in both
  - Describe what a self-defence class can and cannot teach, and how to choose one
  - Make a safety plan for yourself or your household and know where to get help afterwards
prerequisites: []
sensitive_domain: true
