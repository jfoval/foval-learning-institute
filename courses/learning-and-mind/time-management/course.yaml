id: time-management
title: Time Management
school: learning-and-mind
subject: Learning & Mind
level: Foundation
status: drafting
summary: >-
  Where your hours actually go, why the usual advice fails, and a small system for deciding what
  gets done and what does not.
description: >-
  Most time management teaches you to fit more in. This course starts from the opposite premise:
  the hours are fixed, the list is not, and the skill is deciding. It covers how to find out where
  your time really goes rather than where you think it goes, why estimates run short in a way that
  is measurable and predictable, what the evidence does and does not show about planning, lists and
  multitasking, and how to build a week that survives contact with other people. It is the last
  course in the first term of the Core, after the ones that teach you how to learn, read, write,
  think and use a machine, because it is the course that decides when you will do any of it.
outcomes:
  - >-
    Measure where your time actually goes for one week, and say in writing where your record and
    your impression disagreed
  - >-
    Explain why estimates of how long work will take run short, what has been measured about it,
    and what does and does not reduce it
  - >-
    Decide what not to do, in writing, with the cost of each decision named rather than assumed
  - >-
    Build and run a weekly plan that names the fixed points first, and say what it gave up
  - >-
    State what the evidence shows about switching between tasks, and what follows for how you
    arrange a working day
  - >-
    Read a piece of time-management advice and say what it assumes about your circumstances, your
    obligations and who else has a claim on your hours
prerequisites: []
sensitive_domain: false
