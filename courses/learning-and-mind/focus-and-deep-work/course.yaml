id: focus-and-deep-work
title: Focus and Deep Work
school: learning-and-mind
subject: Learning & Mind
level: Foundation
status: drafting
summary: >-
  What attention actually is when it is measured, what an interruption really costs, and how to get
  a difficult hour out of an ordinary day.
description: >-
  This is the most advised-about subject in the whole genre and one of the least measured. The
  course goes to what has been measured: how long people actually work before switching, what
  happens to a task after it is interrupted, whether anybody has shown that focus can be trained,
  and what the evidence says about the devices everybody blames. It is the third course of the term
  on running yourself, after Habits and Self-Discipline, and it takes up the half of attention that
  Time Management and Habits both stopped short of: not what to do with your hours, and not how to
  make a behaviour automatic, but what happens inside the hour itself.
outcomes:
  - >-
    State what has been measured about how long people work before switching, and on whom
  - >-
    Say what an interruption costs, distinguishing the time to return from the effect on the work
  - >-
    Sort a claim about attention into measurable, unmeasurable as stated, or false
  - >-
    Design one working hour against what the evidence supports, and say which part of it is evidence
    and which part is your own judgement
  - >-
    State what the evidence does and does not show about whether attention can be trained
prerequisites: []
sensitive_domain: false
