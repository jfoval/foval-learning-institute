id: conversation-and-listening
title: Conversation and Listening
school: communication-and-people
subject: Communication & People
level: Foundation
status: drafting
summary: >-
  Listen so that people feel heard and you actually understand them, keep a conversation going, ask
  better questions, and know what the research does and doesn't show about talking well.
description: >-
  Most of what goes wrong between people goes wrong in ordinary conversation: a question that wasn't
  really a question, an answer to something the other person didn't say, a turn that went on too
  long. This course covers how conversation works (turn-taking, questions, follow-ups, silence),
  what active listening is and what the evidence says it does, how to hear what someone means as well
  as what they say, and how to talk with people who differ from you in age, culture or view. It
  separates findings that have held up from popular advice that hasn't, and it opens Term 4, the
  term on people.
outcomes:
  - Explain how turn-taking, questions and follow-ups shape a conversation, and what the research
    shows about each
  - Practise listening that checks understanding, and tell it apart from listening that only waits
    for a turn
  - Ask open and follow-up questions that move a conversation on, and judge when not to ask
  - Recognise common ways conversations go wrong (interrupting, advice-giving, one-upping) and repair
    them
  - Weigh popular claims about conversation and body language against what the evidence supports
prerequisites: []
sensitive_domain: true
