id: conversation-and-listening
title: Conversation and Listening
school: communication-and-people
subject: Communication & People
level: Foundation
status: drafting
summary: >-
  Listen so that people feel heard and you actually understand them, keep a conversation going, ask
  better questions, and know what the research does and doesn't show about talking well.
description: >-
  Most of what goes wrong between people goes wrong in ordinary conversation: a question that wasn't
  really a question, an answer to something the other person didn't say, a turn that went on too
  long. This course covers how conversation works (turn-taking, questions, follow-ups, silence),
  what active listening is and what the evidence says it does, how to hear what someone means as well
  as what they say, and how to talk with people who differ from you in age, culture or view. It
  separates findings that have held up from popular advice that hasn't, and it opens Term 4, the
  term on people.
outcomes:
  - Explain how turns change hands in conversation, why replies are planned while the other person is
    still talking, and what a pause or a hedged reply signals
  - Identify the common ways listening fails, including interrupting, self-focus and unasked-for
    advice, and state what the evidence on interruption and gender does and does not show
  - Ask open and follow-up questions, rewrite questions that invite a false answer, and decide when not
    to ask
  - Check understanding by saying back what you heard until the speaker agrees, and compare what the
    research shows about active listening with what its textbooks claim
  - Respond to someone with a problem in ways the evidence supports, and, when a friend may be at risk
    of suicide, do what the crisis services advise and connect them to help
  - Weigh popular claims about conversation, body language, culture and changing minds against the
    evidence, naming who was studied and what it was compared with
prerequisites: [logic-and-argument, mental-fitness]
sensitive_domain: true
