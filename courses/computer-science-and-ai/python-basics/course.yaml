id: python-basics
title: Introduction to Programming with Python
school: computer-science-and-ai
subject: Computer Science & AI
level: Foundation
status: published
summary: >-
  Learn to think like a programmer and write real Python from your first lesson. No prior experience
  needed.
description: >-
  Programming is the skill of giving precise instructions to a machine. This course teaches you the
  core ideas every programmer relies on, using Python, one of the most readable and widely used
  languages in the world. By the end you will be able to write small programs that store data, make
  decisions, repeat work, and organise themselves into reusable pieces. Every lesson also teaches
  you to read one more kind of error message, because a beginner meets their first one about ninety
  seconds in, and reading them is a skill rather than a talent.
outcomes:
  - Run Python two ways, and read a traceback from the bottom up to find what stopped and why
  - Explain what = does in terms of names and values, and convert what input() gives you
  - Choose between branches with if, elif and else, and predict which one runs
  - Repeat work with for and while, and build an accumulator that totals and counts
  - Write functions with parameters and return values, and say what return gives that print does not
  - Use lists and dictionaries, and predict what happens when two names share one list
prerequisites: []
estimated_hours: 7.2
