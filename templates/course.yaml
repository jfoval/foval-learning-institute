id: course-id                 # must match folder name; lowercase, hyphens
title: Course Title
school: school-slug           # one of the 15 in curriculum/TAXONOMY.md; must match parent folder
subject: School Display Name  # e.g. "History", "Money", "Natural Sciences"
level: Foundation             # Foundation | Core | Advanced
status: research              # planned | research | drafting | published
summary: One sentence for the catalog card. What you'll be able to do.
description: >-
  Two to four sentences for the course page. What the course covers, who it's for,
  why it matters, and what makes this treatment worth your time.
outcomes:
  - Verb-first, testable outcome (explain, calculate, build, compare, apply...)
  - Another
  - Another
prerequisites: []             # course ids, e.g. [algebra-essentials]
# There is no hours field. The site sums every lesson's and assessment's measured `minutes:`;
# `npm run minutes` measures them.
sensitive_domain: false       # required. true if Part 3.4 of the standards applies; makes the neutrality audit mandatory
# standpoint: christian       # required under courses/christian-studies/, forbidden elsewhere; shows the standpoint label (standards 3.7)
